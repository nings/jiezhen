version: '3.8'

services:
  # 交易机器人主服务
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jiezhen-trading-bot
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
      - OKX_API_KEY=${OKX_API_KEY}
      - OKX_SECRET_KEY=${OKX_SECRET_KEY}
      - OKX_PASSPHRASE=${OKX_PASSPHRASE}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./ml_data:/app/ml_data
      - ./ml_models:/app/ml_models
      - ./log:/app/log
      - ./backtest_equity.csv:/app/backtest_equity.csv
      - ./backtest_trades.csv:/app/backtest_trades.csv
    ports:
      - "8501:8501"
    depends_on:
      - redis
    networks:
      - trading-network
    command: streamlit run monitor_dashboard.py --server.port=8501 --server.address=0.0.0.0

  # ML策略服务
  ml-strategy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jiezhen-ml-strategy
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
      - OKX_API_KEY=${OKX_API_KEY}
      - OKX_SECRET_KEY=${OKX_SECRET_KEY}
      - OKX_PASSPHRASE=${OKX_PASSPHRASE}
      - REDIS_HOST=redis
    volumes:
      - ./ml_data:/app/ml_data
      - ./ml_models:/app/ml_models
      - ./log:/app/log
    depends_on:
      - redis
    networks:
      - trading-network
    command: python zhen_ml.py
    profiles:
      - production

  # 订单簿策略服务
  orderbook-strategy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jiezhen-orderbook-strategy
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
      - OKX_API_KEY=${OKX_API_KEY}
      - OKX_SECRET_KEY=${OKX_SECRET_KEY}
      - OKX_PASSPHRASE=${OKX_PASSPHRASE}
      - REDIS_HOST=redis
    volumes:
      - ./log:/app/log
    depends_on:
      - redis
    networks:
      - trading-network
    command: python zhen_orderbook.py
    profiles:
      - production

  # Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: jiezhen-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - trading-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # PostgreSQL数据库（可选，用于存储历史数据）
  postgres:
    image: postgres:15-alpine
    container_name: jiezhen-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=trading
      - POSTGRES_USER=trader
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - trading-network
    profiles:
      - database

  # Grafana监控面板（可选）
  grafana:
    image: grafana/grafana:latest
    container_name: jiezhen-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - trading-network
    profiles:
      - monitoring

  # Prometheus监控（可选）
  prometheus:
    image: prom/prometheus:latest
    container_name: jiezhen-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - trading-network
    profiles:
      - monitoring

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local

networks:
  trading-network:
    driver: bridge
